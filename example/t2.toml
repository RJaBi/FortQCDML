value = "UNKNOWN"


# ============================================================================
# Markov sequence
# ============================================================================

[markov_sequence]

annotation = """
The LIME file contains two updates from the same Markov chain. Each update is
represented by a separate markovStep. The second update contains both an SU(3)
gauge field and a U(1) phase field.
"""

uri = "mc://ildg/example/ensemble"
series = "production-A"


# ----------------------------------------------------------------------------
# First Markov step
# ----------------------------------------------------------------------------

[[markov_sequence.steps]]

annotation = """
Configuration saved after 100 molecular-dynamics trajectories.
"""

# This is a string so values such as "000100" retain their leading zeroes.
update = "000100"


[[markov_sequence.steps.records]]

field = "su3gauge"
crc_checksum = "4210888484"
ave_plaquette = 0.593421123456789


# ----------------------------------------------------------------------------
# Second Markov step
# ----------------------------------------------------------------------------

[[markov_sequence.steps]]

annotation = """
Configuration saved after 120 molecular-dynamics trajectories. The SU(3) and
U(1) fields are associated with the same update and therefore occur as records
within the same markovStep.
"""

update = "000120"


[[markov_sequence.steps.records]]

field = "su3gauge"

# Checksums remain strings because valid QCDml examples include values larger
# than signed 32-bit integers, leading zeroes, and the value "UNKNOWN".
crc_checksum = "4012345678"

ave_plaquette = 0.594102987654321


[[markov_sequence.steps.records]]

field = "u1phase"
crc_checksum = "0123456789"
ave_plaquette = 0.9987654321


# ============================================================================
# Additional information
# ============================================================================

[additional_info]

annotation = """
The configuration was generated as part of an example SU(3)+U(1) production
ensemble. The checksum values refer to the corresponding records in the LIME
container. This annotation uses the standard QCDml additionalInfo annotation
element; arbitrary foreign-namespace XML extensions are not represented by
the current FortQCDML TOML model.
"""