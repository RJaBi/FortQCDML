# ============================================================================
# QCDml configuration metadata
# ============================================================================

data_lfn = "lfn://ildg/example/ensemble/configurations/config_000120"
precision = "double"


# ============================================================================
# Management metadata
# ============================================================================

[management]

annotation = """
Metadata describing the creation, revision history, and archival management
of this gauge configuration.
"""

# These are strings so their original XML lexical representation is preserved.
revisions = "2"
reference = "https://example.org/publications/ensemble-description"


# ----------------------------------------------------------------------------
# Initial generation event
# ----------------------------------------------------------------------------

[[management.archive_events]]

annotation = """
The gauge configuration was generated by the production simulation and
registered in the ILDG catalogue.
"""

revision = "0"
revision_action = "generate"
date = "2026-09-01T10:30:00+09:30"

[management.archive_events.participant]

orcid = "0000-0003-2137-045X"
name = "Example Generator"
institution = "Example Lattice Gauge Theory Collaboration"


# ----------------------------------------------------------------------------
# Metadata addition event
# ----------------------------------------------------------------------------

[[management.archive_events]]

annotation = """
Algorithm parameters and the measured average plaquette were added after
post-processing.
"""

revision = "1"
revision_action = "add"
date = "2026-09-02T14:20:00+09:30"

[management.archive_events.participant]

orcid = "0000-0002-3834-0284"
name = "Example Metadata Curator"
institution = "Example National Computing Facility"


# ----------------------------------------------------------------------------
# Metadata replacement event without an ORCID
#
# When ORCID is absent, both name and institution are required.
# ----------------------------------------------------------------------------

[[management.archive_events]]

annotation = """
The checksum metadata was replaced after verification against the original
LIME container.
"""

revision = "2"
revision_action = "replace"
date = "2026-09-03T09:15:00+09:30"

[management.archive_events.participant]

name = "Example Archive Administrator"
institution = "Example ILDG Regional Grid"


# ============================================================================
# Implementation metadata
# ============================================================================

[implementation]

annotation = """
The production calculation used a distributed-memory GPU implementation with
MPI communication and accelerator offloading.
"""


# ----------------------------------------------------------------------------
# Machine
# ----------------------------------------------------------------------------

[implementation.machine]

annotation = """
The job used 64 GPU nodes. Each node contained four accelerator devices and
was connected through a high-speed interconnect.
"""

name = "example-gpu-supercomputer"
institution = "Example National Computing Facility"
type = "GPU-accelerated HPC cluster"


# ----------------------------------------------------------------------------
# Simulation code
# ----------------------------------------------------------------------------

[implementation.code]

annotation = """
The executable was compiled with optimisation enabled and linked against the
site MPI and accelerator runtime libraries.
"""

name = "ExampleSU3HMC"
version = "2.4.1"
date = "2026-08-20T16:45:00+09:30"


# ============================================================================
# Algorithm metadata
# ============================================================================

[algorithm]

annotation = """
Hybrid Monte Carlo simulation using multiple time scales, even-odd
preconditioning, mass preconditioning, and an Omelyan integrator.
"""


# ----------------------------------------------------------------------------
# Arbitrary algorithm parameters
#
# Parameter values are deliberately strings. This preserves scientific
# notation, leading zeroes, whitespace-separated vectors, and textual values.
# ----------------------------------------------------------------------------

[[algorithm.parameters]]

annotation = "Wilson gauge coupling."
name = "beta"
value = "6.000000"


[[algorithm.parameters]]

annotation = "Four-dimensional lattice dimensions."
name = "lattice_size"
value = "32 32 32 64"


[[algorithm.parameters]]

annotation = "Number of dynamical fermion flavours."
name = "number_of_flavours"
value = "2+1"


[[algorithm.parameters]]

annotation = "Bare light-quark mass."
name = "light_quark_mass"
value = "-0.120900"


[[algorithm.parameters]]

annotation = "Bare strange-quark mass."
name = "strange_quark_mass"
value = "-0.118000"


[[algorithm.parameters]]

annotation = "Length of one molecular-dynamics trajectory."
name = "trajectory_length"
value = "1.0"


[[algorithm.parameters]]

annotation = "Molecular-dynamics integration method."
name = "integrator"
value = "Omelyan-Mryglod-Folk"


[[algorithm.parameters]]

annotation = "Omelyan integration parameter."
name = "omelyan_lambda"
value = "0.1931833275037836"


[[algorithm.parameters]]

annotation = "Number of integration levels."
name = "integration_levels"
value = "3"


[[algorithm.parameters]]

annotation = "Integration steps at each time scale."
name = "integration_steps"
value = "4 5 6"


[[algorithm.parameters]]

annotation = "Number of pseudofermion fields."
name = "pseudofermion_fields"
value = "3"


[[algorithm.parameters]]

annotation = "Hasenbusch mass-preconditioning parameters."
name = "hasenbusch_masses"
value = "0.1 0.2 0.4"


[[algorithm.parameters]]

annotation = "Stopping criterion used for force calculations."
