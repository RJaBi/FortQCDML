[[algorithm.parameters]]

annotation = "Target residue retained in its original scientific notation."
name = "targetResidue"
value = "1e-07"


[[algorithm.parameters]]

annotation = "Gauge-link smearing method."
name = "smearing_method"
value = "stout"


[[algorithm.parameters]]

annotation = "Number of stout-smearing iterations."
